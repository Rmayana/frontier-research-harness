<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex 외부 하네스 아키텍처</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; color: #1e293b; background: #fff; }
    .diagram { width: min(100%, 780px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .harness { width: 100%; border: 1px solid #8fd1b8; background: #effaf5; border-radius: 15px; padding: 22px; }
    .heading { margin: 0 0 16px; text-align: center; font-size: 19px; font-weight: 750; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .tile { min-height: 75px; display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 14px; border-radius: 10px; background: #fff; border: 1px solid #e2e8f0; }
    .tile strong { font-size: 15px; }
    .tile span { font-size: 13px; color: #64748b; }
    .connector { display: flex; align-items: center; flex-direction: column; gap: 5px; color: #64748b; font-size: 13px; }
    .connector .arrows { font-size: 23px; line-height: 23px; }
    .bridge { width: 100%; padding: 18px; border: 1px solid #cbd5e1; border-radius: 13px; text-align: center; font-weight: 650; background: #fff; }
    .core { width: 100%; background: #f3f4f6; padding: 22px; border-radius: 15px; text-align: center; }
    .core h2 { font-size: 19px; margin: 0 0 7px; }
    .core p { color: #64748b; margin: 0; font-size: 14px; }
    @media(max-width: 460px) { .grid { grid-template-columns: 1fr; } body { padding: 18px 12px; } }
  </style>
</head>
<body>
  <main class="diagram" aria-label="Codex 외부 하네스 구성도">
    <section class="harness">
      <h1 class="heading">외부 하네스 (직접 설계)</h1>
      <div class="grid">
        <div class="tile"><strong>워크플로 제어</strong><span>Python · LangGraph · Temporal</span></div>
        <div class="tile"><strong>다중 에이전트</strong><span>LangGraph · 자체 Orchestrator</span></div>
        <div class="tile"><strong>도구 통합</strong><span>MCP · Python 함수</span></div>
        <div class="tile"><strong>상태 및 기억</strong><span>SQLite · PostgreSQL · Redis</span></div>
        <div class="tile"><strong>검증</strong><span>pytest · Pydantic · Evals</span></div>
        <div class="tile"><strong>모니터링</strong><span>LangSmith · Langfuse</span></div>
      </div>
    </section>
    <div class="connector"><span class="arrows">↕</span></div>
    <section class="bridge">Codex SDK / App Server / CLI</section>
    <div class="connector"><span class="arrows">↕</span></div>
    <section class="core">
      <h2>Codex Core</h2>
      <p>기존 Agent Loop · 모델 추론 · 도구 실행 · 컨텍스트 관리</p>
    </section>
  </main>
</body>
</html>
