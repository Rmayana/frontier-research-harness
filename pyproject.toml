[project]
name = "frontier-research-harness"
version = "0.1.0"
description = "Lightweight Codex research workspace with scholarly search and external scientific models"
readme = "README.md"
authors = [
    { name = "Rmayana", email = "215244493+Rmayana@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cobra>=0.32.1",
    "mcp>=1.26.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
